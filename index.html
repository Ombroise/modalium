<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17132a">
<title>Modalium</title>
<style>
:root{--bg:#17132a;--fg:#ddd6f3;--dim:#8f87b3;--glow:rgba(168,150,235,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) center/cover no-repeat;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body.cover::before{content:"";position:fixed;inset:0;background:rgba(23,19,42,.6)}
main{position:relative;padding:env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);outline-offset:1.5rem}
main:focus-visible{outline:1px dashed var(--dim)}
.ring{width:min(52vw,14rem);aspect-ratio:1;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center}
.ring i{box-sizing:content-box;width:0;height:0;border-style:solid;border-width:1rem 0 1rem 1.7rem;border-color:transparent transparent transparent var(--fg);margin-left:.45rem}
body.on .ring{animation:breathe 7s ease-in-out infinite}
body.on .ring i{width:1.2rem;height:2rem;border-width:0 .4rem;border-color:var(--fg);margin-left:0}
body.err .ring{border-style:dashed;border-color:var(--dim);opacity:.6}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--glow);transform:scale(1)}50%{box-shadow:0 0 3.5rem 1rem var(--glow);transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){body.on .ring{animation:none;box-shadow:0 0 2.5rem .5rem var(--glow)}}
</style>
</head>
<body>
<main id="t" role="button" tabindex="0" aria-label="Lancer ou mettre en pause la boucle">
  <div class="ring"><i></i></div>
</main>
<script>
(() => {
  // Adresse du QR code : index.html?b=01  ->  joue audio/01.mp3 en boucle
  // Autre format : ?b=01.wav  ->  joue audio/01.wav
  const raw = (new URLSearchParams(location.search).get('b') || '').replace(/[^\w.\-]/g, '');
  const hasExt = /\.[a-z0-9]+$/i.test(raw);
  const file = hasExt ? raw : raw + '.mp3';
  const base = raw.replace(/\.[a-z0-9]+$/i, '');
  const main = document.getElementById('t');
  // Cercle en pointillés et estompé = aucune boucle à lire (adresse vide ou fichier introuvable)
  if (!raw) { document.body.classList.add('err'); return; }
  document.title = 'Modalium · ' + base;

  const audio = new Audio('audio/' + file);
  audio.loop = true;
  audio.preload = 'auto';
  let failed = false;

  // Écran de verrouillage + image de fond optionnelle (audio/01.jpg, .webp ou .png)
  const meta = art => {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: base, artist: 'Modalium', artwork: art ? [{ src: art }] : [] });
  };
  meta();
  try {
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  } catch (e) {}
  const tryCover = (i = 0) => {
    const ext = ['jpg', 'webp', 'png'][i];
    if (!ext) return;
    const src = 'audio/' + base + '.' + ext, img = new Image();
    img.onload = () => {
      document.body.style.backgroundImage = 'url("' + src + '")';
      document.body.classList.add('cover');
      meta(src);
    };
    img.onerror = () => tryCover(i + 1);
    img.src = src;
  };
  tryCover();

  audio.addEventListener('play', () => document.body.classList.add('on'));
  audio.addEventListener('pause', () => document.body.classList.remove('on'));
  audio.addEventListener('error', () => {
    failed = true;
    document.body.classList.remove('on');
    document.body.classList.add('err');
  });

  const toggle = () => {
    if (failed) return;
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  };
  document.body.addEventListener('click', toggle);
  main.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  // Tente de lancer tout seul ; si le navigateur refuse, un tap suffit.
  audio.play().catch(() => {});
})();
</script>
</body>
</html>
